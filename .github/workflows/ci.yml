name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]   # Linux amd64, Linux arm64, macOS Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: pirn
      - uses: actions/checkout@v4      # go.mod replaces the heedle-ai modules with ../
        with:
          repository: heedle-ai/weft
          path: weft
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/shuttle
          path: shuttle
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/draft
          path: draft
      - name: private-reed
        # read-only deploy key on heedle-ai/reed
        uses: actions/checkout@v4
        with:
          repository: heedle-ai/reed
          path: reed
          ssh-key: ${{ secrets.REED_DEPLOY_KEY }}
      - name: private-bobbin
        # read-only deploy key on heedle-ai/bobbin
        uses: actions/checkout@v4
        with:
          repository: heedle-ai/bobbin
          path: bobbin
          ssh-key: ${{ secrets.BOBBIN_DEPLOY_KEY }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: pirn/go.mod
          cache-dependency-path: pirn/go.sum
      - name: gofmt
        working-directory: pirn
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        working-directory: pirn
        run: go vet ./...
      - name: test
        working-directory: pirn
        run: go test -race ./...
      - name: invariants
        working-directory: pirn
        run: bash .github/invariants.sh
      # GitHub's Linux runners have Podman; macOS runners have no container
      # engine. Here the agent runs in a real container, and skipping fails.
      - name: containers
        if: matrix.os == 'ubuntu-latest'
        working-directory: pirn
        env:
          PIRN_REQUIRE_PODMAN: "1"
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y busybox-static >/dev/null
          go test -count=1 -v -run 'TestContainer_' . | tee containers.log
          ! grep -q -- '--- SKIP' containers.log
          grep -q -- '--- PASS: TestContainer_AgentInARealSession' containers.log
          grep -q -- '--- PASS: TestContainer_AgentKeepsAwkwardFiles' containers.log
