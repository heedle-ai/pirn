name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    # bash -eo pipefail: a failing command in a pipe fails the step
    # (the default, bash -e, ignores it).
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]   # Linux amd64, Linux arm64, macOS Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: pirn
      - uses: actions/checkout@v4      # go.mod replaces the heedle-ai modules with ../
        with:
          repository: heedle-ai/weft
          path: weft
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/shuttle
          path: shuttle
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/draft
          path: draft
      - name: private-reed
        # read-only deploy key on heedle-ai/reed
        uses: actions/checkout@v4
        with:
          repository: heedle-ai/reed
          path: reed
          ssh-key: ${{ secrets.REED_DEPLOY_KEY }}
      - name: private-bobbin
        # read-only deploy key on heedle-ai/bobbin
        uses: actions/checkout@v4
        with:
          repository: heedle-ai/bobbin
          path: bobbin
          ssh-key: ${{ secrets.BOBBIN_DEPLOY_KEY }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: pirn/go.mod
          cache-dependency-path: pirn/go.sum
      - name: gofmt
        working-directory: pirn
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        working-directory: pirn
        run: go vet ./...
      - name: test
        working-directory: pirn
        run: go test -race ./...
      - name: invariants
        working-directory: pirn
        run: bash .github/invariants.sh
      # GitHub's Linux runners have Podman; macOS runners have no container
      # engine. Here the agent runs in a real container, and skipping fails.
      - name: containers
        if: matrix.os == 'ubuntu-latest'
        working-directory: pirn
        env:
          PIRN_REQUIRE_PODMAN: "1"
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y busybox-static >/dev/null
          # oras and the distribution project's registry, pinned by hash,
          # for the large-file test.
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl -sSfLo oras.tgz https://github.com/oras-project/oras/releases/download/v1.2.3/oras_1.2.3_linux_amd64.tar.gz
          curl -sSfLo reg.tgz https://github.com/distribution/distribution/releases/download/v3.0.0/registry_3.0.0_linux_amd64.tar.gz
          echo "b4efc97a91f471f323f193ea4b4d63d8ff443ca3aab514151a30751330852827  oras.tgz" | sha256sum -c
          echo "61c9a2c0d5981a78482025b6b69728521fbc78506d68b223d4a2eb825de5ca3d  reg.tgz" | sha256sum -c
          tar -xzf oras.tgz -C bin oras && tar -xzf reg.tgz -C bin registry
          export PATH="$RUNNER_TEMP/bin:$PATH"
          cd "$GITHUB_WORKSPACE/pirn"
          go test -count=1 -v -run 'TestContainer_' . | tee containers.log
          if grep -q -- '--- SKIP' containers.log; then echo 'a test skipped'; exit 1; fi
          grep -q -- '--- PASS: TestContainer_AgentInARealSession' containers.log
          grep -q -- '--- PASS: TestContainer_AgentKeepsAwkwardFiles' containers.log
          grep -q -- '--- PASS: TestContainer_AgentKeepsLargeFilesInARegistry' containers.log
          grep -q -- '--- PASS: TestContainer_AgentFollowsASkill' containers.log
          grep -q -- '--- PASS: TestContainer_LocalConnectorInARealSession' containers.log
