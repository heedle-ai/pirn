<svg xmlns="http://www.w3.org/2000/svg" width="700" height="540" viewBox="0 0 700 540" role="img"><title>Take the wheel</title><desc>When Claude meets a sign-in, a code, a CAPTCHA or a choice it cannot make, it calls ask_person with a reason; the step pauses, with its budget, and heedle tells you it needs you. While the step is paused for you, and only from this machine, your clicks and keys in the live view go to the container's Chromium as DevTools input events, and the hold lets what you send through, recorded as sent by you. The frames you see while driving are never stored, with password fields and your details masked, and what you type is hidden as typed by you wherever it would show. Hand back closes the hold and gives Claude a fresh outline and a note that a person acted; Claude carries on on the page you left it.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.w{stroke:#5F5E5A;stroke-width:1.5;fill:none}.dot{fill:#5F5E5A}
.d{stroke:#888780;stroke-width:0.8;fill:none;stroke-dasharray:5 4}
.l{font-size:12px;fill:#5F5E5A}.f{font-size:13px;fill:#444441}
.t1{font-size:14px;font-weight:600}.t2{font-size:12px}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .t1{fill:#3C3489}.p .t2{fill:#534AB7}
.g rect{fill:#E1F5EE;stroke:#0F6E56}.g .t1{fill:#085041}.g .t2{fill:#0F6E56}
.c rect{fill:#FAECE7;stroke:#993C1D}.c .t1{fill:#712B13}.c .t2{fill:#993C1D}
.n rect{fill:#F1EFE8;stroke:#5F5E5A}.n .t1{fill:#444441}.n .t2{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.w{stroke:#B4B2A9}.dot{fill:#B4B2A9}.d{stroke:#888780}.l{fill:#B4B2A9}.f{fill:#D3D1C7}
.p rect{fill:#3C3489;stroke:#AFA9EC}.p .t1{fill:#EEEDFE}.p .t2{fill:#CECBF6}
.g rect{fill:#085041;stroke:#5DCAA5}.g .t1{fill:#E1F5EE}.g .t2{fill:#9FE1CB}
.c rect{fill:#712B13;stroke:#F0997B}.c .t1{fill:#FAECE7}.c .t2{fill:#F5C4B3}
.n rect{fill:#444441;stroke:#B4B2A9}.n .t1{fill:#F1EFE8}.n .t2{fill:#D3D1C7}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text class="l" x="40" y="34">Take the wheel (9.10): Claude ; ask_person ; (you drive ⊗ hold open for you) ; hand back ; Claude</text><g class="g"><rect x="40" y="60" width="180" height="52" rx="6" stroke-width="0.8"/><text class="t1" x="130.0" y="76" text-anchor="middle" dominant-baseline="central">Claude acts</text><text class="t2" x="130.0" y="95" text-anchor="middle" dominant-baseline="central">until it can't go on</text></g><g class="p"><rect x="260" y="60" width="180" height="52" rx="6" stroke-width="0.8"/><text class="t1" x="350.0" y="76" text-anchor="middle" dominant-baseline="central">ask_person(reason)</text><text class="t2" x="350.0" y="95" text-anchor="middle" dominant-baseline="central">it pauses, and its budget</text></g><g class="n"><rect x="480" y="60" width="180" height="52" rx="6" stroke-width="0.8"/><text class="t1" x="570.0" y="76" text-anchor="middle" dominant-baseline="central">heedle needs you</text><text class="t2" x="570.0" y="95" text-anchor="middle" dominant-baseline="central">a notification, with a link</text></g><path class="w" d="M220 86L258 86" marker-end="url(#a)"/><path class="w" d="M440 86L478 86" marker-end="url(#a)"/><g class="c"><rect x="40" y="170" width="290" height="64" rx="6" stroke-width="0.8"/><text class="t1" x="185.0" y="186" text-anchor="middle" dominant-baseline="central">you drive the live view</text><text class="t2" x="185.0" y="205" text-anchor="middle" dominant-baseline="central">clicks and keys → DevTools input</text></g><text class="f" x="195" y="262" text-anchor="start">only while paused for you,</text><text class="f" x="195" y="278" text-anchor="start">only from this machine</text><g class="c"><rect x="370" y="170" width="290" height="64" rx="6" stroke-width="0.8"/><text class="t1" x="515.0" y="186" text-anchor="middle" dominant-baseline="central">the hold opens for you</text><text class="t2" x="515.0" y="205" text-anchor="middle" dominant-baseline="central">what you send is “sent by you”</text></g><text class="f" x="350" y="207" text-anchor="middle">⊗</text><path class="w" d="M570 112L570 140L185 140L185 168" marker-end="url(#a)"/><path class="w" d="M515 140L515 168" marker-end="url(#a)"/><g class="n"><rect x="40" y="290" width="290" height="52" rx="6" stroke-width="0.8"/><text class="t1" x="185.0" y="306" text-anchor="middle" dominant-baseline="central">live frames, never stored</text><text class="t2" x="185.0" y="325" text-anchor="middle" dominant-baseline="central">passwords and your details masked</text></g><g class="n"><rect x="370" y="290" width="290" height="52" rx="6" stroke-width="0.8"/><text class="t1" x="515.0" y="306" text-anchor="middle" dominant-baseline="central">what you typed</text><text class="t2" x="515.0" y="325" text-anchor="middle" dominant-baseline="central">⟨typed by you⟩ everywhere it would show</text></g><path class="d" d="M185 234L185 288" marker-end="url(#a)"/><path class="d" d="M515 234L515 288" marker-end="url(#a)"/><g class="p"><rect x="170" y="380" width="360" height="52" rx="6" stroke-width="0.8"/><text class="t1" x="350.0" y="396" text-anchor="middle" dominant-baseline="central">hand back</text><text class="t2" x="350.0" y="415" text-anchor="middle" dominant-baseline="central">the hold closes; a fresh outline, “a person acted”</text></g><path class="w" d="M185 342L185 362L300 362L300 378" marker-end="url(#a)"/><path class="w" d="M515 342L515 362L400 362L400 378" marker-end="url(#a)"/><g class="g"><rect x="170" y="460" width="360" height="52" rx="6" stroke-width="0.8"/><text class="t1" x="350.0" y="476" text-anchor="middle" dominant-baseline="central">Claude carries on</text><text class="t2" x="350.0" y="495" text-anchor="middle" dominant-baseline="central">on the page you left it</text></g><path class="w" d="M350 432L350 458" marker-end="url(#a)"/></svg>