<svg xmlns="http://www.w3.org/2000/svg" width="700" height="450" viewBox="0 0 700 450" role="img"><title>Replay without Claude</title><desc>An act step looks for the script the last successful run of its program kept for it. If its question is the same, it reads the page before each recorded action and checks the outline is the one recorded; if so it does the action, finding each element by role and name, through the same checks as Claude's actions: the allowlist, the password check and the hold, so a send still asks you. On the first page that differs, Claude carries on, told where and why. With no script, or :replay "off", Claude does it all. The record keeps every action, where it handed over, and its own script.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.w{stroke:#5F5E5A;stroke-width:1.5;fill:none}.dot{fill:#5F5E5A}
.d{stroke:#888780;stroke-width:0.8;fill:none;stroke-dasharray:5 4}
.l{font-size:12px;fill:#5F5E5A}.f{font-size:13px;fill:#444441}
.t1{font-size:14px;font-weight:600}.t2{font-size:12px}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .t1{fill:#3C3489}.p .t2{fill:#534AB7}
.g rect{fill:#E1F5EE;stroke:#0F6E56}.g .t1{fill:#085041}.g .t2{fill:#0F6E56}
.c rect{fill:#FAECE7;stroke:#993C1D}.c .t1{fill:#712B13}.c .t2{fill:#993C1D}
.n rect{fill:#F1EFE8;stroke:#5F5E5A}.n .t1{fill:#444441}.n .t2{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.w{stroke:#B4B2A9}.dot{fill:#B4B2A9}.d{stroke:#888780}.l{fill:#B4B2A9}.f{fill:#D3D1C7}
.p rect{fill:#3C3489;stroke:#AFA9EC}.p .t1{fill:#EEEDFE}.p .t2{fill:#CECBF6}
.g rect{fill:#085041;stroke:#5DCAA5}.g .t1{fill:#E1F5EE}.g .t2{fill:#9FE1CB}
.c rect{fill:#712B13;stroke:#F0997B}.c .t1{fill:#FAECE7}.c .t2{fill:#F5C4B3}
.n rect{fill:#444441;stroke:#B4B2A9}.n .t1{fill:#F1EFE8}.n .t2{fill:#D3D1C7}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text class="l" x="40" y="34">Replay without Claude (roadmap 9.9): act = find ; (check ; action)* ; (Claude, from where the page differs)</text><g class="n"><rect x="40" y="60" width="190" height="52" rx="6" stroke-width="0.8"/><text class="t1" x="135.0" y="76" text-anchor="middle" dominant-baseline="central">last successful run</text><text class="t2" x="135.0" y="95" text-anchor="middle" dominant-baseline="central">same Loom-Program, node</text></g><g class="p"><rect x="280" y="60" width="190" height="52" rx="6" stroke-width="0.8"/><text class="t1" x="375.0" y="76" text-anchor="middle" dominant-baseline="central">same question?</text><text class="t2" x="375.0" y="95" text-anchor="middle" dominant-baseline="central">inputs' SHA-256</text></g><g class="g"><rect x="520" y="60" width="150" height="52" rx="6" stroke-width="0.8"/><text class="t1" x="595.0" y="76" text-anchor="middle" dominant-baseline="central">read the page</text><text class="t2" x="595.0" y="95" text-anchor="middle" dominant-baseline="central">its outline</text></g><path class="w" d="M230 86L278 86" marker-end="url(#a)"/><path class="w" d="M470 86L518 86" marker-end="url(#a)"/><g class="p"><rect x="520" y="160" width="150" height="52" rx="6" stroke-width="0.8"/><text class="t1" x="595.0" y="176" text-anchor="middle" dominant-baseline="central">as recorded?</text><text class="t2" x="595.0" y="195" text-anchor="middle" dominant-baseline="central">outline's SHA-256</text></g><path class="w" d="M595 112L595 158" marker-end="url(#a)"/><g class="g"><rect x="280" y="160" width="190" height="52" rx="6" stroke-width="0.8"/><text class="t1" x="375.0" y="176" text-anchor="middle" dominant-baseline="central">the recorded action</text><text class="t2" x="375.0" y="195" text-anchor="middle" dominant-baseline="central">by role and name</text></g><path class="w" d="M518 186L472 186" marker-end="url(#a)"/><text class="f" x="495" y="178" text-anchor="middle">yes</text><g class="c"><rect x="280" y="260" width="190" height="52" rx="6" stroke-width="0.8"/><text class="t1" x="375.0" y="276" text-anchor="middle" dominant-baseline="central">allowlist ; password ; hold</text><text class="t2" x="375.0" y="295" text-anchor="middle" dominant-baseline="central">a send asks you, as ever</text></g><path class="w" d="M375 212L375 258" marker-end="url(#a)"/><path class="d" d="M280 286L200 286L200 150L595 150L595 140" marker-end="url(#a)"/><text class="f" x="206" y="236" text-anchor="start">next</text><g class="c"><rect x="520" y="260" width="150" height="52" rx="6" stroke-width="0.8"/><text class="t1" x="595.0" y="276" text-anchor="middle" dominant-baseline="central">Claude carries on</text><text class="t2" x="595.0" y="295" text-anchor="middle" dominant-baseline="central">told where and why</text></g><path class="w" d="M595 212L595 258" marker-end="url(#a)"/><text class="f" x="625" y="236" text-anchor="middle">no</text><g class="n"><rect x="280" y="370" width="390" height="52" rx="6" stroke-width="0.8"/><text class="t1" x="475.0" y="386" text-anchor="middle" dominant-baseline="central">the record</text><text class="t2" x="475.0" y="405" text-anchor="middle" dominant-baseline="central">every action ; where it handed over ; its own script</text></g><path class="w" d="M375 312L375 368" marker-end="url(#a)"/><path class="w" d="M595 312L595 368" marker-end="url(#a)"/><path class="w" d="M135 112L135 396" marker-end="url(#a)"/><path class="w" d="M135 396L278 396" marker-end="url(#a)"/><text class="f" x="143" y="334" text-anchor="start">none, or :replay "off":</text><text class="f" x="143" y="350" text-anchor="start">Claude from the start</text></svg>