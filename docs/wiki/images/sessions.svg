<svg xmlns="http://www.w3.org/2000/svg" width="700" height="470" viewBox="0 0 700 470" role="img"><title>Saved sign-ins</title><desc>After you sign in while driving, you may tick Keep me signed in on the site you are on. The browser's storage state is cut to that one host, sealed with AES-256-GCM under a new key kept in the keychain, and written to its own file in ~/.heedle/sessions. A later act step whose allowlist includes that exact host opens it with its key and starts signed in as you, and always stops before sending and asks you; the card says so in red. Forget under You, heedle secret delete --all, or 30 days unused removes the file and the key.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.w{stroke:#5F5E5A;stroke-width:1.5;fill:none}.dot{fill:#5F5E5A}
.d{stroke:#888780;stroke-width:0.8;fill:none;stroke-dasharray:5 4}
.l{font-size:12px;fill:#5F5E5A}.f{font-size:13px;fill:#444441}
.t1{font-size:14px;font-weight:600}.t2{font-size:12px}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .t1{fill:#3C3489}.p .t2{fill:#534AB7}
.g rect{fill:#E1F5EE;stroke:#0F6E56}.g .t1{fill:#085041}.g .t2{fill:#0F6E56}
.c rect{fill:#FAECE7;stroke:#993C1D}.c .t1{fill:#712B13}.c .t2{fill:#993C1D}
.n rect{fill:#F1EFE8;stroke:#5F5E5A}.n .t1{fill:#444441}.n .t2{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.w{stroke:#B4B2A9}.dot{fill:#B4B2A9}.d{stroke:#888780}.l{fill:#B4B2A9}.f{fill:#D3D1C7}
.p rect{fill:#3C3489;stroke:#AFA9EC}.p .t1{fill:#EEEDFE}.p .t2{fill:#CECBF6}
.g rect{fill:#085041;stroke:#5DCAA5}.g .t1{fill:#E1F5EE}.g .t2{fill:#9FE1CB}
.c rect{fill:#712B13;stroke:#F0997B}.c .t1{fill:#FAECE7}.c .t2{fill:#F5C4B3}
.n rect{fill:#444441;stroke:#B4B2A9}.n .t1{fill:#F1EFE8}.n .t2{fill:#D3D1C7}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text class="l" x="40" y="34">Saved sign-ins (9.11): keep ; ForHost ; (sealed file ⊗ key) ; load for its exact host ; act</text><g class="p"><rect x="40" y="60" width="190" height="52" rx="6" stroke-width="0.8"/><text class="t1" x="135.0" y="76" text-anchor="middle" dominant-baseline="central">hand back</text><text class="t2" x="135.0" y="95" text-anchor="middle" dominant-baseline="central">“Keep me signed in on …”</text></g><g class="n"><rect x="255" y="60" width="190" height="52" rx="6" stroke-width="0.8"/><text class="t1" x="350.0" y="76" text-anchor="middle" dominant-baseline="central">ForHost(state, host)</text><text class="t2" x="350.0" y="95" text-anchor="middle" dominant-baseline="central">that host’s cookies, exactly</text></g><g class="c"><rect x="470" y="60" width="190" height="52" rx="6" stroke-width="0.8"/><text class="t1" x="565.0" y="76" text-anchor="middle" dominant-baseline="central">heedle secret delete --all</text><text class="t2" x="565.0" y="95" text-anchor="middle" dominant-baseline="central">or Forget, or 30 days unused</text></g><path class="w" d="M230 86L253 86" marker-end="url(#a)"/><g class="g"><rect x="40" y="170" width="290" height="52" rx="6" stroke-width="0.8"/><text class="t1" x="185.0" y="186" text-anchor="middle" dominant-baseline="central">~/.heedle/sessions/host.session</text><text class="t2" x="185.0" y="205" text-anchor="middle" dominant-baseline="central">AES-256-GCM, host as associated data</text></g><g class="g"><rect x="370" y="170" width="290" height="52" rx="6" stroke-width="0.8"/><text class="t1" x="515.0" y="186" text-anchor="middle" dominant-baseline="central">keychain: HEEDLE_SESSION_…</text><text class="t2" x="515.0" y="205" text-anchor="middle" dominant-baseline="central">a new key each time</text></g><text class="f" x="350" y="200" text-anchor="middle">⊗</text><path class="w" d="M350 112L350 140L185 140L185 168" marker-end="url(#a)"/><path class="w" d="M350 140L515 140L515 168" marker-end="url(#a)"/><path class="d" d="M565 112L565 128L640 128L640 168" marker-end="url(#a)"/><path class="d" d="M565 112L565 128L300 128L300 168" marker-end="url(#a)"/><g class="p"><rect x="170" y="280" width="360" height="52" rx="6" stroke-width="0.8"/><text class="t1" x="350.0" y="296" text-anchor="middle" dominant-baseline="central">a later act step on that exact host</text><text class="t2" x="350.0" y="315" text-anchor="middle" dominant-baseline="central">opens it with its key; never another host’s</text></g><path class="w" d="M185 222L185 252L300 252L300 278" marker-end="url(#a)"/><path class="w" d="M515 222L515 252L400 252L400 278" marker-end="url(#a)"/><g class="c"><rect x="170" y="380" width="360" height="52" rx="6" stroke-width="0.8"/><text class="t1" x="350.0" y="396" text-anchor="middle" dominant-baseline="central">starts signed in as you</text><text class="t2" x="350.0" y="415" text-anchor="middle" dominant-baseline="central">the card says so in red; it always asks before sending</text></g><path class="w" d="M350 332L350 378" marker-end="url(#a)"/></svg>