<svg xmlns="http://www.w3.org/2000/svg" width="700" height="480" viewBox="0 0 700 480" role="img"><title>An act step stops before it sends</title><desc>An act step fills a form with the browser's tools, then calls confirm with a summary before the click that sends it. The step pauses with the browser open: its heartbeat carries the summary and a screenshot, which the run page and loom forms show. You decide; the decision is a signal to the run, which the step asks for every two seconds. Until then reed's hold aborts every request but GET, HEAD and OPTIONS. A yes opens the hold for one send, and Claude clicks; a no, or no answer in 30 minutes, ends the step with nothing sent, and the record keeps what was held.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.w{stroke:#5F5E5A;stroke-width:1.5;fill:none}.dot{fill:#5F5E5A}
.d{stroke:#888780;stroke-width:0.8;fill:none;stroke-dasharray:5 4}
.l{font-size:12px;fill:#5F5E5A}.f{font-size:13px;fill:#444441}
.t1{font-size:14px;font-weight:600}.t2{font-size:12px}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .t1{fill:#3C3489}.p .t2{fill:#534AB7}
.g rect{fill:#E1F5EE;stroke:#0F6E56}.g .t1{fill:#085041}.g .t2{fill:#0F6E56}
.c rect{fill:#FAECE7;stroke:#993C1D}.c .t1{fill:#712B13}.c .t2{fill:#993C1D}
.n rect{fill:#F1EFE8;stroke:#5F5E5A}.n .t1{fill:#444441}.n .t2{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.w{stroke:#B4B2A9}.dot{fill:#B4B2A9}.d{stroke:#888780}.l{fill:#B4B2A9}.f{fill:#D3D1C7}
.p rect{fill:#3C3489;stroke:#AFA9EC}.p .t1{fill:#EEEDFE}.p .t2{fill:#CECBF6}
.g rect{fill:#085041;stroke:#5DCAA5}.g .t1{fill:#E1F5EE}.g .t2{fill:#9FE1CB}
.c rect{fill:#712B13;stroke:#F0997B}.c .t1{fill:#FAECE7}.c .t2{fill:#F5C4B3}
.n rect{fill:#444441;stroke:#B4B2A9}.n .t1{fill:#F1EFE8}.n .t2{fill:#D3D1C7}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text class="l" x="40" y="40" text-anchor="start">An act step stops before it sends (roadmap 9.7)</text><g class="g"><rect x="40" y="60" width="180" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="130.0" y="75" text-anchor="middle" dominant-baseline="central">Claude fills the form</text><text class="t2" x="130.0" y="94" text-anchor="middle" dominant-baseline="central">form tools only</text></g><path class="w" d="M220 84 L260 84"/><g class="g"><rect x="260" y="60" width="180" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="350.0" y="75" text-anchor="middle" dominant-baseline="central">confirm(summary)</text><text class="t2" x="350.0" y="94" text-anchor="middle" dominant-baseline="central">before the click that sends</text></g><path class="w" d="M440 84 L480 84"/><rect class="d" x="470" y="48" width="200" height="300" rx="12"/><text class="l" x="480" y="42" text-anchor="start">step paused, browser open</text><g class="p"><rect x="490" y="60" width="160" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="570.0" y="75" text-anchor="middle" dominant-baseline="central">heartbeat</text><text class="t2" x="570.0" y="94" text-anchor="middle" dominant-baseline="central">summary ⊗ screenshot</text></g><path class="w" d="M570 108 L570 130"/><g class="n"><rect x="490" y="130" width="160" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="570.0" y="145" text-anchor="middle" dominant-baseline="central">you decide</text><text class="t2" x="570.0" y="164" text-anchor="middle" dominant-baseline="central">run page ⊗ loom forms</text></g><path class="w" d="M570 178 L570 200"/><g class="p"><rect x="490" y="200" width="160" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="570.0" y="215" text-anchor="middle" dominant-baseline="central">signal</text><text class="t2" x="570.0" y="234" text-anchor="middle" dominant-baseline="central">to the run: send?</text></g><path class="w" d="M570 248 L570 270"/><g class="n"><rect x="490" y="270" width="160" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="570.0" y="285" text-anchor="middle" dominant-baseline="central">the step asks</text><text class="t2" x="570.0" y="304" text-anchor="middle" dominant-baseline="central">its run, every 2 s</text></g><path class="w" d="M490 294 L440 294"/><g class="c"><rect x="260" y="200" width="180" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="350.0" y="215" text-anchor="middle" dominant-baseline="central">reed's hold</text><text class="t2" x="350.0" y="234" text-anchor="middle" dominant-baseline="central">non-GET aborted</text></g><path class="w" d="M350 248 L350 270"/><g class="g"><rect x="260" y="270" width="180" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="350.0" y="285" text-anchor="middle" dominant-baseline="central">yes: one send</text><text class="t2" x="350.0" y="304" text-anchor="middle" dominant-baseline="central">hold opens, then closes</text></g><path class="w" d="M260 294 L220 294"/><g class="g"><rect x="40" y="270" width="180" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="130.0" y="285" text-anchor="middle" dominant-baseline="central">Claude clicks</text><text class="t2" x="130.0" y="304" text-anchor="middle" dominant-baseline="central">the form is sent</text></g><g class="n"><rect x="40" y="370" width="180" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="130.0" y="385" text-anchor="middle" dominant-baseline="central">no, or 30 min</text><text class="t2" x="130.0" y="404" text-anchor="middle" dominant-baseline="central">the step ends</text></g><g class="p"><rect x="260" y="370" width="180" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="350.0" y="385" text-anchor="middle" dominant-baseline="central">record</text><text class="t2" x="350.0" y="404" text-anchor="middle" dominant-baseline="central">nothing sent ⊗ held</text></g><path class="w" d="M220 394 L260 394"/><path class="w" d="M570 318 L570 394 L440 394"/><text class="f" x="350" y="460" text-anchor="middle">act = fill ; confirm ; (pause ; you) ; (send | stop) ; record</text></svg>
